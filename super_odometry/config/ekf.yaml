ukf_filter_node:
  ros__parameters:
    frequency: 50.0  # Run at 50Hz for smooth base_link control
    two_d_mode: false # Set to false since a backhoe on uneven terrain operates in 3D
    publish_acceleration: false
    publish_tf: true
    reset_on_time_jump : True

    # --- Frame Configuration ---
    map_frame: map              
    odom_frame: odom            
    base_link_frame: base_link  
    world_frame: odom


    # ==========================================================
    # INPUT 1: LASER MAPPING ODOMETRY (Absolute Pose)
    # ==========================================================
    odom0: /laser_odometry_base_link
    
    # We trust the Mapping node for our exact position in the world.
    # [X,   Y,   Z]
    # [R,   P,   Y]
    # [Vx,  Vy,  Vz]
    # [VR,  VP,  VY]
    # [Ax,  Ay,  Az]
    odom0_config: [true,  true,  true,
                   true,  true,  true,
                   false, false, false,
                   false, false, false,
                   false, false, false]

    odom0_differential: false # We want the absolute coordinates
    odom0_relative: false
    odom0_queue_size: 5

    # ==========================================================
    # INPUT 2: IMU PREINTEGRATION (High-Frequency Velocities)
    # ==========================================================
    # odom1: /state_estimation
    
    # # # We trust the IMU Preintegration for our moment-to-moment speeds.
    # # # This prevents the robot from "stuttering" between LiDAR scans.
    # odom1_config: [false, false, false,
    #                false, false, false,
    #                true,  true,  true,
    #                true,  true,  true,
    #                false, false, false]

    # odom1_differential: true 
    # odom1_relative: true
    # odom1_queue_size: 10


    odom1: /laser_odometry
    odom1_config: [false,  false,  false,
                   false,  false,  false,
                   true, true, true,
                   true, true, true,
                   false, false, false]

    odom1_queue_size: 5
    odom1_differential: true 


    # ==========================================================
    # INPUTs: IMU's (From the LiDARs we are not using)
    # ==========================================================
    # imu0: /livox/left/imu
    # imu0_config: [false, false, false,
    #                false, false, false,
    #                false,  false,  false,
    #                true,  true,  true,
    #                true, true, true]
    # imu1: /livox/front/imu
    # imu1_config: [false, false, false,
    #                false, false, false,
    #                false,  false,  false,
    #                true,  true,  true,
    #                true, true, true]
    # imu2: /livox/back/imu
    # imu2_config: [false, false, false,
    #                false, false, false,
    #                false,  false,  false,
    #                true,  true,  true,
    #                true, true, true]